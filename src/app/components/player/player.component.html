<div *ngIf="streamData; else loading;"> 
  <div class="row g-0 mb-3 align-items-center player-container">
    <!-- Cover Art -->
    <div class="col-12 col-md-2 text-center mb-3 mb-md-0">
      <img [src]="streamData.cover" (error)="useFallbackCover($event)" alt="Cover art or Radio Balu logo" class="cover-art" />
    </div>

    <!-- Play Button -->
    <div class="col-12 col-md-1 d-flex justify-content-center mb-3 mb-md-0">
      <button class="play-btn" (click)="togglePlay(audioPlayer)">
        <i class="bi" [ngClass]="isPlaying ? 'bi-pause-fill' : 'bi-play-fill'"></i>
      </button>
    </div>

    <!-- Title + Volume -->
    <div class="col-12 col-md-4 col-lg-5 text-center text-md-start pe-md-3">
      <h5 class="title">{{ streamData.title }}</h5>
      <audio #audioPlayer [src]="streamUrl" (play)="isPlaying = true" (pause)="isPlaying = false" (error)="isPlaying = false"></audio>

      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        [value]="volume"
        (input)="changeVolume(audioPlayer, $event)"
        class="volume-slider"
      />
    </div>

    <!-- Track History -->
    <div class="col-12 col-md-5 col-lg-4 ps-md-3">
      <ul class="track-history mt-4">
        <li *ngFor="let track of streamData.history" class="track-item">
          <img
            *ngIf="track.cover"
            [src]="track.cover"
            (error)="useFallbackCover($event)"
            alt="Cover for {{ track.title }}"
            class="track-cover"
          />
          <span class="track-name">{{ track.title }}</span>
        </li>
      </ul>
    </div>
  </div>
  <div class="row g-0 ps-md-5">
    {{ streamData.listeners }} {{ streamData.listeners === 1 ? 'listener' : 'listeners' }}
  </div>
</div>

<ng-template #loading>
  <p class="loading-text">Loading stream data...</p>
</ng-template>
